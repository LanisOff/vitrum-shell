<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The vitrum mark: a glass tile with a V of two strokes. No fonts. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc3ff"/>
      <stop offset="1" stop-color="#4f6fd6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="60" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="60" fill="url(#sheen)"/>
  <rect x="17" y="17" width="222" height="222" rx="59" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M78 82 L128 178 L178 82" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
